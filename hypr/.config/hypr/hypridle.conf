general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 150                                # 2.5 menit
    on-timeout = brightnessctl -s set 10         # Meredupkan lampu layar
    on-resume = brightnessctl -r                 # Mengembalikan lampu layar
}

listener {
    timeout = 300                                # 5 menit
    on-timeout = loginctl lock-session           # Mengunci layar
}

listener {
    timeout = 330                                # 5.5 menit
    on-timeout = hyprctl dispatch dpms off       # Mematikan layar (DPMS)
    on-resume = hyprctl dispatch dpms on         # Menyalakan layar kembali
}

listener {
    timeout = 1800                               # 30 menit
    on-timeout = systemctl suspend               # Masuk mode suspend
}

