# BACKGROUND
background {
    monitor =
    path = /home/derilkarf/Pictures/Wallpaper/miku.jpeg 
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8916
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
    fade_in_step = 0.02
    fade_out_step = 0.02
}

# Profie-Photo
image {
    monitor =
    path = /home/derilkarf/Pictures/Profile_Picture/pp7.jpg
    border_size = 2
    border_color = rgba(234,230,240, 0.71)
    size = 100
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 170
    halign = center
    valign = center
}

# NAMA
label {
    monitor =
    text = $USER
    color = rgba(234,230,240, 0.80)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# Waktu
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(234,230,240, 0.80)
    font_size = 60
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# Hari-Bulan-Tahun
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(234,230,240, 0.80)
    font_size = 19
    font_family = SF Pro Display Bold
    position = 0, -90
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

