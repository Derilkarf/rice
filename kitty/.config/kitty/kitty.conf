# include matching wallpaper
include ~/.cache/wal/colors-kitty.conf 
font_family JetBrainsMono Nerd Font

# animasi kursor
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 1
custom_shaders cursor-trail-motion-blur

# Bg opacity
background_opacity 0.7

# Biar mulainya gk fullscreen 
remember_window_size no
initial_window_width 100c 
initial_window_height 30c

# Flexible Layout (Horizontal & Vertical)
enabled_layouts splits
map f5 launch --location=hsplit --cwd=current
map f6 launch --location=vsplit --cwd=current

# Keybind Layout
map ctrl+alt+left neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up neighboring_window top
map ctrl+alt+down neighboring_window bottom

map ctrl+alt+h resize_window narrower
map ctrl+alt+j resize_window wider
map ctrl+alt+k resize_window taller
map ctrl+alt+l resize_window shorter
